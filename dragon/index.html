<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragon English 100 · 發音練習</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1a1d21; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-soft:#eff4ff;
    --ok:#16a34a; --warn:#b45309; --bad:#dc2626; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111418; --card:#1a1e24; --text:#e8eaed; --muted:#9aa3ad;
           --line:#2a3038; --accent:#60a5fa; --accent-soft:#1b2735; --ok:#4ade80;
           --warn:#fbbf24; --bad:#f87171; --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",
                 "Hiragino Sans","Microsoft JhengHei",sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}

  /* ---------- header ---------- */
  header{padding:26px 0 14px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.2px}
  .sub{font-size:13px;color:var(--muted)}
  .sub a{color:var(--accent);text-decoration:none}
  .sub a:hover{text-decoration:underline}

  /* ---------- toolbar ---------- */
  .bar{
    position:sticky;top:0;z-index:30;background:var(--bg);
    padding:10px 0;border-bottom:1px solid var(--line);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  }
  .bar input[type=search]{
    flex:1 1 190px;min-width:150px;padding:7px 11px;font-size:14px;
    border:1px solid var(--line);border-radius:8px;background:var(--card);
    color:var(--text);outline:none;
  }
  .bar input[type=search]:focus{border-color:var(--accent)}
  button,select{
    font:inherit;font-size:13px;color:var(--text);background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;
  }
  button:hover,select:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.08)}
  button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .progress-label{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;
       overflow:hidden;background:var(--card);flex:0 0 auto}
  .seg button{border:0;border-radius:0;padding:7px 11px;background:transparent}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 45%, var(--line))}
  button.danger:hover{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 10%, transparent)}
  button.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}

  /* ---------- player ---------- */
  .player{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);margin:16px 0;overflow:hidden;
  }
  .top{display:flex;align-items:stretch}
  .player .video{position:relative;flex:0 0 340px;height:191px;background:#000}
  .player .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video-note{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    text-align:center;padding:18px;color:#e5e7eb;background:#111;
    font-size:14px;line-height:1.6;
  }
  .now{flex:1 1 auto;min-width:0;padding:14px 16px}
  .now .en{font-size:17px;font-weight:600;margin:0 0 4px}
  .now .zh{font-size:14px;color:var(--muted);margin:0}
  .now .meta{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
  .transport{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px;align-items:center}
  .seekbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 16px 14px}
  .seekbar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s linear}
  .hint{font-size:12px;color:var(--muted);padding:0 16px 12px}
  .hint kbd{
    font:inherit;font-size:11px;background:var(--bg);border:1px solid var(--line);
    border-radius:4px;padding:1px 5px;
  }
  .status{
    display:none;gap:8px;flex-wrap:wrap;align-items:center;
    background:color-mix(in srgb, var(--warn) 12%, transparent);
    border-top:1px solid var(--line);padding:10px 16px;font-size:13px;
  }
  .status.show{display:flex}
  .status .msg{flex:1 1 240px;color:var(--text)}
  .status a{color:var(--accent);text-decoration:none}
  .status a:hover{text-decoration:underline}
  .status button{padding:5px 9px;font-size:12.5px}

  /* ---------- list ---------- */
  ul.list{list-style:none;margin:0;padding:0}
  li.item{
    display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;margin:8px 0;cursor:pointer;
    transition:border-color .12s, background .12s, opacity .12s;
  }
  li.item:hover{border-color:var(--accent)}
  li.item.current{border-color:var(--accent);background:var(--accent-soft);
    box-shadow:0 0 0 1px var(--accent) inset}
  li.item.done .en{color:var(--muted)}
  li.item.done{opacity:.72}
  .num{
    flex:0 0 auto;width:34px;height:24px;border-radius:6px;background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;
  }
  li.item.current .num{background:var(--accent);color:#fff}
  .body{flex:1 1 auto;min-width:0}
  .en{font-size:15.5px;font-weight:550;margin:0 0 3px;word-break:break-word}
  .zh{font-size:13.5px;color:var(--muted);margin:0;word-break:break-word}
  .side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .time{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .check{
    font-size:11px;border:1px solid var(--line);border-radius:20px;
    padding:2px 8px;color:var(--muted);background:transparent;cursor:pointer;user-select:none;
  }
  li.item.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
  .dcheck{
    font-size:11px;border:1px dashed var(--line);border-radius:20px;
    padding:2px 8px;color:var(--muted);background:transparent;cursor:pointer;user-select:none;
  }
  .dcheck:hover{border-color:var(--accent);color:var(--accent)}
  .dcheck.on{background:var(--accent);border:1px solid var(--accent);color:#fff}
  li.item.drilling{border-color:var(--accent)}
  .en.masked{color:var(--muted);font-weight:500;letter-spacing:.4px}

  /* ---------- dictation drill ---------- */
  .drill{
    flex:0 0 100%;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
    display:flex;flex-direction:column;gap:8px;cursor:default;
  }
  .drill-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
  .drill-head .dz{flex:1 1 220px;min-width:0;font-size:13.5px;color:var(--text);
                  word-break:break-word}
  .drill-head .wc{color:var(--muted);white-space:nowrap}
  .drill textarea{
    width:100%;font:inherit;font-size:15.5px;padding:9px 11px;resize:vertical;
    border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);
    outline:none;line-height:1.5;
  }
  .drill textarea:focus{border-color:var(--accent)}
  .drill-foot{font-size:12px;color:var(--muted)}
  .drill-result{
    font-size:14px;line-height:1.65;padding:10px 12px;border:1px solid var(--line);
    border-radius:8px;background:var(--bg);
  }
  .drill-result.ok{
    border-color:var(--ok);font-weight:600;color:var(--ok);
    background:color-mix(in srgb, var(--ok) 12%, transparent);
  }
  .legend{font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .diff{font-size:15.5px;line-height:1.9;word-break:break-word;margin-bottom:8px}
  .d-ok{color:var(--text)}
  .d-miss{color:var(--bad);text-decoration:line-through;opacity:.8}
  .d-extra{color:var(--bad);background:color-mix(in srgb, var(--bad) 18%, transparent);
           border-radius:3px;padding:0 3px}
  .ans{font-size:13.5px;word-break:break-word;margin-top:4px}
  .ans .lab{color:var(--muted)}
  .ans-en{font-weight:600}
  .ans-zh{font-size:13px;color:var(--muted);margin-top:3px;word-break:break-word}
  .drill-result .again{margin-top:8px}
  .empty{color:var(--muted);font-size:14px;padding:24px 4px;text-align:center}
  footer{font-size:12px;color:var(--muted);text-align:center;padding:26px 0 0}
  @media (max-width:640px){
    .top{flex-direction:column}
    .player .video{flex:none;width:100%;height:auto;padding-top:56.25%}
    .now .en{font-size:15.5px}
    .en{font-size:14.5px}
    .bar{gap:6px}
    .progress-label{margin-left:0}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Dragon English 100 · 發音練習</h1>
    <div class="sub">竹岡廣信《Dragon English 基本英文 100》全 100 句，
      音源為 YouTube 逐句朗讀影片（17:21）：
      <a href="https://www.youtube.com/watch?v=SAPl2dIV0oA" target="_blank" rel="noopener">英検道Channel</a>
    </div>
  </header>

  <div class="bar">
    <input type="search" id="q" placeholder="搜尋英文 / 中文 / 編號…" autocomplete="off">
    <select id="filter" title="篩選">
      <option value="all">全部</option>
      <option value="todo">未聽</option>
      <option value="done">已聽</option>
    </select>
    <div class="seg" role="group" aria-label="練習模式">
      <button id="drillRead" class="on" title="聽讀：點句子播放">聽讀</button>
      <button id="drillWrite" title="默寫：聽音後打出這句英文">默寫</button>
    </div>
    <button id="repeatBtn" title="單句重複次數">重複 ×1</button>
    <select id="speed" title="播放速度">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
    </select>
    <button id="playAllBtn" class="primary">▶ 連續播放</button>
    <button id="resetBtn" class="danger"
            title="清除「已聽」與「已默寫」進度（播放設定會保留）">重設</button>
    <span class="progress-label" id="progress">已聽 0 / 100</span>
  </div>

  <div class="player">
    <div class="top">
      <div class="video">
        <div id="ytbox"><div id="yt"></div></div>
        <div class="video-note" id="videoNote"></div>
      </div>
      <div class="now">
        <p class="en" id="nowEn">點下面任何一句開始播放</p>
        <p class="zh" id="nowZh">選擇句子後會跳到影片中該句的時間點</p>
        <div class="meta" id="nowMeta"></div>
      </div>
    </div>
    <div class="seekbar"><i id="seekFill"></i></div>
    <div class="transport">
      <button id="prevBtn" title="上一句 (↑)">◀ 上一句</button>
      <button id="replayBtn" title="重播這一句 (R)">↺ 重播</button>
      <button id="nextBtn" title="下一句 (↓)">下一句 ▶</button>
      <button id="stopBtn" title="停止 (Esc)">■ 停止</button>
      <span class="hint" style="padding:0" id="modeLabel"></span>
    </div>
    <div class="hint">
      快捷鍵：<kbd>Space</kbd> 播放／暫停 · <kbd>↑</kbd><kbd>↓</kbd> 換句 ·
      <kbd>R</kbd> 重播 · <kbd>Esc</kbd> 停止 · 點句子即可播放
      · 切到「默寫」可練聽打（Enter 送出）
    </div>
    <div class="status" id="status">
      <span class="msg" id="statusMsg"></span>
      <button id="retryApi">重試 YouTube 播放器</button>
      <button id="useEmbed">改用備援播放器</button>
      <button id="useTts">改用離線朗讀</button>
      <a href="#" id="openYt">在 YouTube 開啟</a>
    </div>
  </div>

  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" style="display:none">沒有符合的句子</div>

  <footer>句子原文取自公開 PDF、時間軸由影片自動字幕與音檔能量分析校正 · 僅供個人學習使用</footer>
</div>

 {

  "end": 300.98
 },
 {

  "end": 317.72
 },
 {

  "end": 335.84
 },
 {

  "end": 340.58
 },
 {

 {

 },
 {

 {

 },

  li.className = "item";
  li.dataset.i = i;
  li.innerHTML =
    '<span class="num">' + s.n + '</span>' +
    '<div class="body"><p class="en"></p><p class="zh"></p></div>' +
    '<div class="side"><span class="time">' + fmt(s.end - s.start) + '</span>' +
    '<span class="check" role="button">聽過</span>' +
    '<span class="dcheck" role="button">默寫</span></div>';
  li.querySelector(".en").textContent = s.en;
  li.querySelector(".zh").textContent = s.zh;
  li.addEventListener("click", e => {
    if (e.target.classList.contains("check")) { toggleDone(i); e.stopPropagation(); return; }
    if (e.target.classList.contains("dcheck")) {
      e.stopPropagation(); setDrill("write"); openDrill(i); return;
    }
    if (e.target && e.target.closest && e.target.closest(".drill")) return;
    if (settings.drill === "write") openDrill(i);
    else play(i, true);
  });
  listEl.appendChild(li);
});
const rows = [...listEl.children];

function refreshDoneUI() {
  rows.forEach((li, i) => {
    const n = DATA[i].n;
    li.classList.toggle("done", done.has(n));
    const ok = !!(dictated[n] && dictated[n].ok);
    const b = li.querySelector(".dcheck");
    b.classList.toggle("on", ok);
    b.textContent = ok ? "已默寫" : "默寫";
    b.title = ok ? "已通過默寫，點此再練一次" : "點此開始默寫這一句";
  });
  const heard = [...done].filter(n => DATA.some(s => s.n === n)).length;
  const passed = DATA.filter(s => dictated[s.n] && dictated[s.n].ok).length;
  $("#progress").textContent = "已聽 " + heard + " / 100 · 已默寫 " + passed + " / 100";
}
function toggleDone(n) {
  const num = DATA[n].n;
  done.has(num) ? done.delete(num) : done.add(num);
  localStorage.setItem(LS_DONE, JSON.stringify([...done]));
  refreshDoneUI();
}
function saveSettings(){ localStorage.setItem(LS_SET, JSON.stringify(settings)); }
function markDictated(i, tries) {
  const n = DATA[i].n, prev = dictated[n];
  if (prev && prev.ok && prev.tries <= tries) return;      // keep the best run
  dictated[n] = {ok:true, tries:tries, date:new Date().toISOString().slice(0,10)};
  localStorage.setItem(LS_DICT, JSON.stringify(dictated));
  refreshDoneUI();
}
function markDone(i) {
  if (!done.has(DATA[i].n)) {
    done.add(DATA[i].n);
    localStorage.setItem(LS_DONE, JSON.stringify([...done]));
    refreshDoneUI();
  }
}
refreshDoneUI();

/* ================= filter ================= */
function applyFilter() {
  const q = $("#q").value.trim().toLowerCase();
  const f = $("#filter").value;
  let visible = 0;
  rows.forEach((li, i) => {
    const s = DATA[i];
    let show = true;
    if (q) show = (s.en + " " + s.zh + " " + s.n).toLowerCase().includes(q);
    if (show && f === "done") show = done.has(s.n);
    if (show && f === "todo") show = !done.has(s.n);
    li.style.display = show ? "" : "none";
    if (show) visible++;
  });
  $("#empty").style.display = visible ? "none" : "";
}
$("#q").addEventListener("input", applyFilter);
$("#filter").addEventListener("change", applyFilter);

function visibleIdxs() {
  return rows.map((li, i) => li.style.display === "none" ? -1 : i).filter(i => i >= 0);
}
function neighbour(dir) {
  const vis = visibleIdxs();
  if (!vis.length) return -1;
  const pos = vis.indexOf(cur);
  if (pos === -1) return dir > 0 ? vis[0] : vis[vis.length - 1];
  const next = pos + dir;
  return next >= 0 && next < vis.length ? vis[next] : -1;
}

/* ================= engine: mode management ================= */

  embed: "音源：YouTube 備援播放器",
  tts:   "音源：離線朗讀（系統語音）"
};

function showStatus(msg) {
  $("#statusMsg").textContent = msg;
  $("#status").classList.add("show");
}
function hideStatus(){ $("#status").classList.remove("show"); }

function setMode(m, reason) {
  if (mode === m && !reason) return;
  hardStop();
  mode = m; settings.mode = m; saveSettings();
  if (m === "api")   { embedFrame = null; resetApi(); }
  if (m === "embed") enterEmbed(reason);
  if (m === "tts")   enterTts(reason);
  paintMode();
}

/* ================= engine: YouTube IFrame API ================= */
function resetApi() {
  player = null; playerReady = false; pendingSeek = null;
  $("#ytbox").innerHTML = '<div id="yt"></div>';
  if (apiReady && typeof YT !== "undefined" && YT.Player) createPlayer();
  else loadApi();
}
function loadApi() {
  if (apiReady) { createPlayer(); return; }
  if (apiLoading) return;
  apiLoading = true;
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => { apiLoading = false; degrade("無法載入 YouTube 播放器腳本（網路被擋或離線）。"); };
  document.head.appendChild(s);
  setTimeout(() => {
    if (!apiReady) { apiLoading = false; degrade("YouTube 播放器逾時未就緒（載入超過 12 秒）。"); }
  }, 12000);
}
function degrade(reason) {
  if (mode === "embed" || mode === "tts") return;
  showStatus(reason + " 已自動切換到備援播放器，若仍無聲可改用離線朗讀。");
  setMode("embed", reason);
}

window.onYouTubeIframeAPIReady = function () {
  apiReady = true;
  apiLoading = false;
  createPlayer();
};
function createPlayer() {
  if (!apiReady || player) return;
  $("#ytbox").innerHTML = '<div id="yt"></div>';
  try {
    player = new YT.Player("yt", {
      videoId: VIDEO_ID,
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, start: 0 },
      events: {
        onReady: () => {
          playerReady = true;
          apiLoading = false;
          try { player.setPlaybackRate(settings.speed); } catch (e) {}
          hideStatus();
          if (pendingSeek !== null) { const i = pendingSeek; pendingSeek = null; play(i, false); }
        },
        onError: () => degrade("這個影片無法嵌入播放（可能被設為禁止嵌入）。"),
        onStateChange: e => {
          playing = (e.data === 1);
          if (e.data === 1) startTick();
          if (e.data === 2 || e.data === 0) stopTick();
        }
      }
    });
  } catch (err) {
    degrade("建立 YouTube 播放器失敗。");
  }
}

function apiSeek(i) {
  const s = DATA[i];
  player.seekTo(s.start + 0.05, true);
  try { player.setPlaybackRate(settings.speed); } catch (e) {}
  player.playVideo();
}

/* ================= engine: plain iframe (fallback) ================= */
function embedSrc(s, autoplay, at) {
  let st = Math.floor(at != null ? at : s.start);
  st = clamp(st, 0, Math.max(0, Math.floor(s.end) - 1));
  // file:// pages report origin "null" — sending that breaks YouTube's widget
  // handshake, so only attach a real http(s) origin.
  let origin = "";
  try { if (location && /^https?:\/\//.test(String(location.origin))) origin = location.origin; }
  catch (e) {}
  // base = YouTube's official embed URL (share params kept), plus per-sentence range
  return "https://www.youtube.com/embed/" + VIDEO_ID +
    "?si=YPCLWqkTA_glCWg_" +
    "&start=" + st + "&end=" + Math.ceil(s.end) +
    "&autoplay=" + (autoplay ? 1 : 0) +
    "&rel=0&playsinline=1&enablejsapi=1" +
    (origin ? "&origin=" + encodeURIComponent(origin) : "");
}
function ensureEmbedFrame() {
  if (embedFrame) return embedFrame;
  const box = $("#ytbox");
  box.innerHTML = "";
  // official YouTube embed markup
  const f = document.createElement("iframe");
  f.setAttribute("width", "560");
  f.setAttribute("height", "315");
  f.setAttribute("title", "YouTube video player");
  f.setAttribute("frameborder", "0");
  f.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");
  f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
  f.setAttribute("allowfullscreen", "");
  box.appendChild(f);
  embedFrame = f;
  embedLoaded = false;
  f.addEventListener("load", () => {
    embedLoaded = true;
    embedPost({event:"listening", id:1, channel:"widget"});
  });
  return f;
}
function embedPost(msg) {
  try {
    if (embedFrame && embedFrame.contentWindow)
      embedFrame.contentWindow.postMessage(JSON.stringify(msg), "*");
  } catch (e) {}
}
function enterEmbed(reason) {
  mode = "embed"; settings.mode = "embed"; saveSettings();
  const f = ensureEmbedFrame();
  // show a paused player right away (also kicks off the postMessage handshake)
  if (!f.src) f.src = embedSrc(DATA[cur >= 0 ? cur : 0], false);
  paintMode();
  showStatus((reason ? reason + " " : "") + "目前使用備援播放器（YouTube 一般嵌入，功能較陽春）。");
  setTimeout(() => {
    if (mode === "embed" && !embedLoaded)
      showStatus("備援播放器也載入失敗（瀏覽器可能完全無法連上 YouTube）。" +
                 "可改用離線朗讀繼續練習，或到 YouTube 開啟本影片。");
  }, 10000);
}
function embedPlay(i) {
  const s = DATA[i];
  const f = ensureEmbedFrame();
  segOffset = s.start; segWallStart = Date.now(); embedTime = null;
  f.src = embedSrc(s, true);
  playing = true;
  startTick();
}
function embedPause() {
  const t = videoTime();
  if (embedAlive) {
    embedPost({event:"command", func:"pauseVideo", args:[]});
  } else if (embedFrame) {
    // no handshake: reload the frame paused at the estimated position
    segOffset = t; embedTime = null;
    embedFrame.src = embedSrc(DATA[cur], false, t);
  }
  playing = false; stopTick();
}
function embedResume() {
  const t = videoTime();
  if (embedAlive) {
    embedPost({event:"command", func:"playVideo", args:[]});
    playing = true; startTick();
  } else if (embedFrame) {
    segOffset = t; embedTime = null;
    embedFrame.src = embedSrc(DATA[cur], true, t);
    playing = true; startTick();
  }
}

// messages posted back by the embed (only if the handshake succeeds)
window.addEventListener("message", e => {
  let d = e.data;
  if (typeof d === "string") { try { d = JSON.parse(d); } catch (err) { return; } }
  if (!d || typeof d !== "object" || d.event === undefined) return;
  if (d.event === "onReady") embedAlive = true;
  if (d.event === "infoDelivery" && d.info) {
    embedAlive = true;
    if (typeof d.info.currentTime === "number") embedTime = d.info.currentTime;
  }
  if (d.event === "onStateChange") {
    if (d.info === 0) onEnd();          // ended at segment end
    if (d.info === 1) { playing = true; startTick(); }
    if (d.info === 2) { playing = false; }
  }
});

/* ================= engine: offline TTS ================= */
function enterTts(reason) {
  mode = "tts"; settings.mode = "tts"; saveSettings();
  ttsSupported = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
  paintMode();
  showStatus((reason ? reason + " " : "") +
    (ttsSupported ? "目前使用離線朗讀（系統英語語音），發音者與影片不同。"
                  : "這個瀏覽器不支援離線朗讀，只能開啟 YouTube 頁面收聽。"));
}
function ttsSpeak(i) {
  if (!ttsSupported) { openInYoutube(i); return; }
  const s = DATA[i];
  const token = ++ttsToken;
  try { window.speechSynthesis.cancel(); } catch (e) {}
  const u = new window.SpeechSynthesisUtterance(s.en);
  u.lang = "en-US"; u.rate = settings.speed;
  u.onend = () => { if (token === ttsToken && cur === i) onEnd(); };
  u.onerror = () => { if (token === ttsToken && cur === i) onEnd(); };
  ttsUtter = u;
  segOffset = s.start; segWallStart = Date.now();
  try { window.speechSynthesis.speak(u); } catch (e) { openInYoutube(i); return; }
  playing = true;
  startTick();
}
function ttsPause(){ try { window.speechSynthesis.pause(); } catch(e){} playing = false; stopTick(); }
function ttsResume(){ try { window.speechSynthesis.resume(); } catch(e){} playing = true; startTick(); }
function ttsCancel(){ try { window.speechSynthesis.cancel(); } catch(e){} ttsToken++; }

/* ================= shared timeline / ticker ================= */
function videoTime() {
  if (mode === "api")   return (player && player.getCurrentTime) ? player.getCurrentTime() : null;
  if (mode === "embed") {
    if (embedAlive && embedTime != null) return embedTime;
    return segOffset + (Date.now() - segWallStart) / 1000;
  }
  if (mode === "tts")   return segOffset + (Date.now() - segWallStart) / 1000;
  return null;
}
function startTick() {
  if (tickTimer) return;
  tickTimer = setInterval(tick, 100);
}
function stopTick(){ clearInterval(tickTimer); tickTimer = null; }
function tick() {
  if (cur < 0) return;
  const s = DATA[cur];
  const t = videoTime();
  if (t == null) return;
  const pct = clamp((t - s.start) / Math.max(0.5, s.end - s.start), 0, 1);
  $("#seekFill").style.width = (pct * 100).toFixed(1) + "%";
  // safety net: TTS normally ends via utterance.onend, allow a little slack
  const limit = (mode === "tts") ? s.end + 3 : s.end - 0.03;
  if (t >= limit) onEnd();
}

/* ================= transport ================= */
function enginePlay(i) {
  if (mode === "api") {
    if (playerReady && player) apiSeek(i);
    else { pendingSeek = i; if (!apiReady) loadApi(); }
  } else if (mode === "embed") {
    embedPlay(i);
  } else {
    ttsSpeak(i);
  }
}
function apiCmd(fn) {
  try { if (player && playerReady && typeof player[fn] === "function") player[fn](); }
  catch (e) {}
}
function enginePause() {
  if (mode === "api")   { apiCmd("pauseVideo"); stopTick(); }
  else if (mode === "embed") embedPause();
  else ttsPause();
  playing = false;
}
function engineResume() {
  if (mode === "api")   { apiCmd("playVideo"); }
  else if (mode === "embed") embedResume();
  else ttsResume();
}
function engineStop() {
  stopTick();
  if (mode === "api")   { apiCmd("pauseVideo"); }
  else if (mode === "embed") {
    if (embedAlive) embedPost({event:"command", func:"pauseVideo", args:[]});
    else if (embedFrame) embedFrame.src = embedSrc(DATA[Math.max(0,cur)], false, DATA[Math.max(0,cur)].start);
  }
  else ttsCancel();
  playing = false;
}
function hardStop(){ engineStop(); }

function play(i, resetRepeat) {
  if (i < 0 || i >= DATA.length) return;
  ending = false;                       // a fresh user-initiated play lifts the end-guard
  if (resetRepeat) { playAll = false; $("#playAllBtn").classList.remove("on");
                     $("#playAllBtn").textContent = "▶ 連續播放"; }
  if (resetRepeat || i !== cur) repeatCount = 0;
  cur = i;
  highlight();
  paintNow();
  $("#seekFill").style.width = "0%";
  enginePlay(i);
}
function paintNow() {
  if (cur < 0) return;
  const s = DATA[cur];
  const write = settings.drill === "write";
  $("#nowEn").textContent = write ? ("第 " + s.n + " 句 · 默寫中（答案不顯示）") : s.en;
  $("#nowZh").textContent = s.zh;
  $("#nowMeta").textContent = "第 " + s.n + " 句 · " + fmt(s.start) + " – " + fmt(s.end) +
      "（約 " + Math.round(s.end - s.start) + " 秒）";
}
function highlight() {
  rows.forEach((li, i) => li.classList.toggle("current", i === cur));
  const li = rows[cur];
  if (li && li.style.display !== "none") {
    const r = li.getBoundingClientRect();
    if (r.top < 90 || r.bottom > window.innerHeight - 40)
      li.scrollIntoView({block:"center", behavior:"smooth"});
  }
}
function onEnd() {
  if (ending) return;
  ending = true;
  setTimeout(() => { ending = false; }, 300);
  stopTick();
  engineStop();
  // dictation listening does not count towards the "heard" progress
  if (cur >= 0 && settings.drill !== "write") markDone(cur);
  repeatCount++;
  const rep = settings.repeat;
  if (repeatCount < rep) {
    setTimeout(() => { if (cur >= 0) enginePlay(cur); }, 400);
    return;
  }
  if (playAll) {
    const nxt = neighbour(1);
    if (nxt >= 0) setTimeout(() => play(nxt, false), 450);
    else stopAll();
  }
}
function stopAll() {
  playAll = false;
  $("#playAllBtn").classList.remove("on");
  $("#playAllBtn").textContent = "▶ 連續播放";
  engineStop();
}
function togglePlay() {
  if (cur < 0) { const v = visibleIdxs(); if (v.length) play(v[0], true); return; }
  if (playing) enginePause(); else engineResume();
}
function openInYoutube(i) {
  window.open("https://www.youtube.com/watch?v=" + VIDEO_ID +
              "&t=" + Math.floor(DATA[i].start) + "s", "_blank");
}

/* ================= dictation drill (默寫) ================= */
const DRILL_MASK = "（默寫中 · 請聽音作答）";

// input-side character equivalences only; everything else is compared strictly
function normalize(t) {
  let s = (t === null || t === undefined) ? "" : String(t);
  s = s.replace(/[\u2018\u2019]/g, "'");            // ‘ ’ → '
  s = s.replace(/[\u201C\u201D]/g, '"');            // “ ” → "
  s = s.replace(/[\uFF01-\uFF5E]/g,                 // fullwidth → ascii
                c => String.fromCharCode(c.charCodeAt(0) - 65248));
  s = s.replace(/\u3000/g, " ").replace(/[\r\n]+/g, " ");
  return s.replace(/^\s+|\s+$/g, "");
}
function wordDiff(a, b) {                           // word-level LCS diff
  const n = a.length, m = b.length;
  const dp = [];
  for (let i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = (a[i] === b[j]) ? dp[i + 1][j + 1] + 1
                                 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push(["=", a[i]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push(["-", a[i]]); i++; }
    else { out.push(["+", b[j]]); j++; }
  }
  while (i < n) out.push(["-", a[i++]]);
  while (j < m) out.push(["+", b[j++]]);
  return out;
}
function checkAnswer(i, raw) {
  const s = DATA[i], typed = normalize(raw);
  const cands = [s.en].concat(ACCEPTED[s.n] || []);
  for (let k = 0; k < cands.length; k++)
    if (typed === normalize(cands[k])) return {ok:true, cand:cands[k]};
  return {ok:false, diff: wordDiff(normalize(s.en).split(" "), typed.split(" "))};
}

function setDrill(m) {
  settings.drill = m; saveSettings();
  $("#drillRead").classList.toggle("on", m === "read");
  $("#drillWrite").classList.toggle("on", m === "write");
  if (m !== "write") closeDrill();
  paintMask();
  paintNow();
}
function paintMask() {
  const write = settings.drill === "write";
  rows.forEach((li, i) => {
    const en = li.querySelector(".en");
    en.textContent = write ? DRILL_MASK : DATA[i].en;
    en.classList.toggle("masked", write);
  });
}
function closeDrill() {
  if (drillEl && drillEl.parentNode) drillEl.remove();
  if (drillIdx >= 0 && rows[drillIdx]) rows[drillIdx].classList.remove("drilling");
  drillEl = null; drillIdx = -1;
}
function openDrill(i) {
  if (i < 0 || i >= DATA.length) return;
  if (settings.drill !== "write") setDrill("write");
  if (drillIdx === i && drillEl) {                   // same row: keep the draft
    const ta = drillEl.querySelector(".di");
    if (ta && ta.focus) ta.focus();
    play(i, true);
    return;
  }
  closeDrill();
  drillIdx = i;
  drillEl = buildDrill(i);
  rows[i].appendChild(drillEl);
  rows[i].classList.add("drilling");
  play(i, true);
  const ta = drillEl.querySelector(".di");
  if (ta && ta.focus) ta.focus();
}
function buildDrill(i) {
  const s = DATA[i];
  const el = document.createElement("div");
  el.className = "drill";
  el.innerHTML =
    '<div class="drill-head">' +
      '<span class="dz"></span><span class="wc"></span>' +
      '<button class="again" type="button">▶ 重聽</button></div>' +
    '<textarea class="di" rows="2" spellcheck="false" ' +
      'placeholder="輸入你聽到的英文句子…"></textarea>' +
    '<div class="drill-foot">Enter 送出 · Shift+Enter 換行 · 大小寫與標點需完全相符</div>' +
    '<div class="drill-result" style="display:none"></div>';
  el.querySelector(".dz").textContent = s.zh;
  el.querySelector(".wc").textContent = s.en.split(" ").length + " 詞";
  el.querySelector(".again").onclick = () => play(i, true);
  el.addEventListener("click", e => e.stopPropagation());  // clicks inside never re-open
  const ta = el.querySelector(".di");
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); drillSubmit(i); }
  });
  el._tries = 0;
  return el;
}
function drillSubmit(i) {
  const el = drillEl;
  if (!el || drillIdx !== i) return;
  const s = DATA[i];
  const ta = el.querySelector(".di");
  const res = el.querySelector(".drill-result");
  const raw = ta.value;
  if (!normalize(raw)) {
    res.style.display = ""; res.className = "drill-result"; res.innerHTML = "";
    res.textContent = "請先輸入你聽到的句子。";
    return;
  }
  el._tries++;
  const r = checkAnswer(i, raw);
  res.style.display = "";
  res.innerHTML = "";
  if (r.ok) {
    res.className = "drill-result ok";
    const t = document.createElement("div");
    t.textContent = "✓ 答對了！（第 " + el._tries + " 次嘗試）";
    res.appendChild(t);
    markDictated(i, el._tries);            // stay on this row — no auto-advance
    return;
  }
  res.className = "drill-result";
  const legend = document.createElement("div");
  legend.className = "legend";
  legend.textContent = "刪除線＝漏打或拼錯 · 紅底＝多打（只標差異，不給提示）";
  res.appendChild(legend);
  const diff = document.createElement("div");
  diff.className = "diff";
  r.diff.forEach(op => {
    const sp = document.createElement("span");
    sp.className = op[0] === "=" ? "d-ok" : (op[0] === "-" ? "d-miss" : "d-extra");
    sp.textContent = op[1] + " ";
    diff.appendChild(sp);
  });
  res.appendChild(diff);
  const ans = document.createElement("div");
  ans.className = "ans";
  const lab = document.createElement("span");
  lab.className = "lab"; lab.textContent = "正確答案：";
  const en = document.createElement("span");
  en.className = "ans-en"; en.textContent = s.en;
  ans.appendChild(lab); ans.appendChild(en);
  res.appendChild(ans);
  const zh = document.createElement("div");
  zh.className = "ans-zh"; zh.textContent = s.zh;
  res.appendChild(zh);
  const again = document.createElement("button");
  again.type = "button"; again.className = "again";
  again.textContent = "▶ 再聽一次";
  again.onclick = () => play(i, true);
  res.appendChild(again);
}

/* ================= controls ================= */
$("#prevBtn").onclick = () => { const n = neighbour(-1); if (n >= 0) play(n, true); };
$("#nextBtn").onclick = () => { const n = neighbour(1); if (n >= 0) play(n, true); };
$("#replayBtn").onclick = () => { if (cur >= 0) { repeatCount = 0; enginePlay(cur); } };
$("#stopBtn").onclick = stopAll;

$("#drillRead").onclick = () => setDrill("read");
$("#drillWrite").onclick = () => setDrill("write");

/* ---- reset heard + dictation progress ---- */
let resetArmedAt = 0;
$("#resetBtn").onclick = () => {
  const msg = "確定要清除「已聽」與「已默寫」的進度嗎？\n" +
              "（播放速度、重複、音源等設定會保留，且無法復原）";
  let go;
  if (typeof confirm === "function") go = confirm(msg);
  else {                                  // no dialog available: two-click guard
    const now = Date.now();
    if (now - resetArmedAt < 5000) { go = true; }
    else {
      resetArmedAt = now;
      const b = $("#resetBtn");
      b.classList.add("armed"); b.textContent = "再按一次確認";
      setTimeout(() => { b.classList.remove("armed"); b.textContent = "重設"; }, 5000);
      return;
    }
  }
  if (!go) return;
  resetArmedAt = 0;
  done = new Set();
  dictated = {};
  localStorage.setItem(LS_DONE, "[]");
  localStorage.setItem(LS_DICT, "{}");
  refreshDoneUI();
  const b = $("#resetBtn");
  b.classList.remove("armed");
  b.textContent = "✓ 已重設";
  setTimeout(() => { b.textContent = "重設"; }, 1500);
};

$("#playAllBtn").onclick = function () {
  playAll = !playAll;
  this.classList.toggle("on", playAll);
  this.textContent = playAll ? "⏸ 停止連續" : "▶ 連續播放";
  if (playAll && (cur < 0 || !playing)) {
    const n = neighbour(1) >= 0 ? neighbour(1) : visibleIdxs()[0];
    if (n >= 0) play(n, false);
  }
};

const REPEATS = [1, 3, Infinity];
const REPEAT_LABEL = {1:"重複 ×1", 3:"重複 ×3", [Infinity]:"重複 ∞"};
function paintRepeat() {
  $("#repeatBtn").textContent = REPEAT_LABEL[settings.repeat] || "重複 ×1";
  $("#repeatBtn").classList.toggle("on", settings.repeat !== 1);
}
$("#repeatBtn").onclick = () => {
  const i = REPEATS.indexOf(settings.repeat);
  settings.repeat = REPEATS[(i + 1) % REPEATS.length];
  saveSettings(); paintRepeat();
};
paintRepeat();

$("#speed").value = String(settings.speed);
$("#speed").onchange = function () {
  settings.speed = parseFloat(this.value);
  saveSettings();
  if (mode === "api" && player && player.setPlaybackRate)
    try { player.setPlaybackRate(settings.speed); } catch (e) {}
  if (mode === "tts" && cur >= 0 && playing) enginePlay(cur);
};

$("#retryApi").onclick = () => {
  hardStop();
  embedFrame = null;
  mode = "api"; settings.mode = "api"; saveSettings();
  if (typeof YT !== "undefined" && YT.Player) apiReady = true;   // script already resident
  resetApi();
  paintMode();
  hideStatus();
};
$("#useEmbed").onclick = () => setMode("embed", "你選擇改用備援播放器。");
$("#useTts").onclick = () => setMode("tts", "你選擇改用離線朗讀。");
$("#openYt").onclick = e => { e.preventDefault(); openInYoutube(cur >= 0 ? cur : 0); };

/* ================= keyboard ================= */
document.addEventListener("keydown", e => {
  if (e.target.matches("input,select,textarea")) return;
  switch (e.key) {
    case " ": e.preventDefault(); togglePlay(); break;
    case "ArrowUp": e.preventDefault(); $("#prevBtn").click(); break;
    case "ArrowDown": e.preventDefault(); $("#nextBtn").click(); break;
    case "r": case "R": $("#replayBtn").click(); break;
    case "Escape": stopAll(); break;
  }
});

/* ================= boot ================= */
paintMode();
setDrill(settings.drill === "write" ? "write" : "read");
if (settings.mode === "embed") enterEmbed("");
else if (settings.mode === "tts") enterTts("");
else loadApi();
</script>
</body>
</html>
